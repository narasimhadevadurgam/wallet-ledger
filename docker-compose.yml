services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet_ledger
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["node", "dist/server.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wallet:wallet@db:5432/wallet_ledger
      PORT: 3000
      LLM_PROVIDER: mock
    ports:
      - "3000:3000"

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wallet:wallet@db:5432/wallet_ledger
      LLM_PROVIDER: mock

volumes:
  db-data:
